[project]
name = "dath-agent-graph"
version = "0.1.0"
description = "ĐATH - Agent Graph: a minimal bi-temporal, permission-aware graph that runs CRONQUESTIONS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgserver>=0.1.4",          # Postgres nhúng: chạy được mà không cài Postgres hay Docker
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain", "src/agent_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "S", "BLE"]
ignore = ["E501"]               # dòng dài trong SQL là chấp nhận được
allowed-confusables = ["–", "—", "×", "≈", "⇒", "→", "−", "·", "↦"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
